[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sih-3d-ulpin"
version = "0.1.0"
description = "3D ULPIN cadastral ingestion and vertical-property mapping platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.1,<3",
  "pydantic>=2.11,<3",
  "pyproj>=3.7,<4",
  "shapely>=2.1,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["Backend*", "Processing*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
